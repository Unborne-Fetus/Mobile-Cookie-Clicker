name: Build Android shell (no game assets)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check no game source was committed
        run: |
          if [ -f app/src/main/assets/game/index.html ] || [ -f app/src/main/assets/game/main.js ]; then
            echo 'ERROR: Copyrighted Cookie Clicker assets must not be committed or distributed' >&2
            exit 1
          fi
      - name: Build debug APK (online mode)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-clicker-unofficial-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
