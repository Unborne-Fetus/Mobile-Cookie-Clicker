name: Publish Android and iOS builder packages

on:
  push:
    branches:
      - mobile-ports
    paths:
      - 'bootstrap/**'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/release-mobile.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out shared mobile source branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ports
          persist-credentials: true

      - name: Materialize the verified source archive (first release only)
        shell: bash
        run: |
          set -euo pipefail
          if test -f bootstrap/mobile-source.tar.xz.b64; then
            base64 --decode bootstrap/mobile-source.tar.xz.b64 > "$RUNNER_TEMP/mobile-source.tar.xz"
            echo "5a7db6170bf1661c35d5fddd1377bb8353fc21765dd98df8fd03d978ae19988d  $RUNNER_TEMP/mobile-source.tar.xz" | sha256sum --check -
            tar --extract --xz --file "$RUNNER_TEMP/mobile-source.tar.xz" --directory .
            rm -rf bootstrap
          fi

      - name: Validate both sources and refuse proprietary game assets
        shell: bash
        run: |
          set -euo pipefail
          test -f android/README.md || { echo 'Android source files are missing'; exit 1; }
          test -f ios/README.md || { echo 'iOS source files are missing'; exit 1; }
          test -f android/app/src/main/java/dev/unofficial/cookieport/MainActivity.java
          test -f ios/CookiePortIOS/PortViewController.swift
          if test -f android/app/src/main/assets/game/index.html || test -f ios/CookiePortIOS/Resources/Website/game/index.html; then
            echo 'Refusing to publish imported proprietary Cookie Clicker game files'
            exit 1
          fi

      - name: Commit platform projects to the shared branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Add Android and iOS source builders'
            git push origin HEAD:mobile-ports
          fi

      - name: Package platform sources as two independent ZIP downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd android && zip -q -r ../dist/Cookie-Clicker-Android-Builder.zip . -x '.git/*' 'app/build/*' 'app/src/main/assets/game/*')
          (cd ios && zip -q -r ../dist/Cookie-Clicker-iOS-IPA-Builder.zip . -x '.git/*' 'CookiePortIOS/Resources/Website/game/*')
          unzip -tq dist/Cookie-Clicker-Android-Builder.zip >/dev/null
          unzip -tq dist/Cookie-Clicker-iOS-IPA-Builder.zip >/dev/null

      - name: Publish one release with separate Android and iOS assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || 'v0.1.0' }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Mobile Cookie Clicker source builders

          **Android — Cookie-Clicker-Android-Builder.zip**
          Experimental Android APK builder and compatibility code. Run START-HERE.bat on Windows.

          **iOS — Cookie-Clicker-iOS-IPA-Builder.zip**
          Separate experimental Swift/Xcode IPA-builder project. Run PREPARE-ON-WINDOWS.bat, then build and sign on a Mac with Xcode.

          Neither ZIP is a prebuilt APK or IPA. Neither includes proprietary Cookie Clicker game assets or installed third-party Steam mods. Do not redistribute a finished game-containing app without permission.
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.zip --clobber
            gh release edit "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" dist/*.zip \
              --target "$(git rev-parse HEAD)" \
              --title "Mobile Cookie Clicker $VERSION (source builders)" \
              --notes-file release-notes.md
          fi
